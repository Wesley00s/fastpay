services:
  postgres:
    image: postgres:18-alpine
    container_name: fastpay-postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - fastpay_pgdata:/var/lib/postgresql/data
    networks:
      - fastpay-network

  kafka:
    image: confluentinc/cp-kafka:8.0.3
    container_name: fastpay-kafka
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "9092:9092"
    volumes:
      - fastpay_kafka_data:/var/lib/kafka/data
    networks:
      - fastpay-network

networks:
  fastpay-network:
    driver: bridge

volumes:
  fastpay_pgdata:
  fastpay_kafka_data: