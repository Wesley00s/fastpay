services:
  app:
    image: fastpay:latest
    networks:
      - fastpay-network
    build:
      context: .
    container_name: fastpay-app
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    env_file:
      - .env
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:18-alpine
    container_name: fastpay-postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - fastpay_pgdata:/var/lib/postgresql/data
    networks:
      - fastpay-network
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:8.0.3
    container_name: fastpay-kafka
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "9092:9092"
    volumes:
      - fastpay_kafka_data:/var/lib/kafka/data
    networks:
      - fastpay-network
    healthcheck:
      test: [ "CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  fastpay-network:
    driver: bridge

volumes:
  fastpay_pgdata:
  fastpay_kafka_data: